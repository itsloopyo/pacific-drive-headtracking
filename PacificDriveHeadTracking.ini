; Pacific Drive Head Tracking configuration.
; Lives next to the game executable: PenDriverPro-Win64-Shipping.exe on Steam,
; PenDriverPro-WinGDK-Shipping.exe on Xbox / Game Pass. Delete to restore
; defaults.

[Network]
; OpenTrack UDP port. Range 1024 to 65535; anything else falls back to 4242 and
; says so in the log.
Port=4242

[Tracking]
; Yes/no keys accept 1/0, true/false, yes/no or on/off. Anything else is
; reported in the log and the default is used.
EnableOnStartup=1
; Rotation sensitivities, range 0.1 to 3.0.
YawSensitivity=1.0
PitchSensitivity=1.0
RollSensitivity=1.0
InvertYaw=0
InvertPitch=0
InvertRoll=0
; Yaw mode: 1 = horizon-locked yaw about world up (default), 0 = camera-local.
WorldSpaceYaw=1
; Smoothing applied when the tracker runs on this machine (loopback).
; 0 = no smoothing, 1 = heavy.
LocalSmoothing=0.0
; Smoothing applied when the tracker is a remote device on the network.
; 0 = no smoothing, 1 = heavy.
RemoteSmoothing=0.15

[Position]
; Position uses the same LocalSmoothing / RemoteSmoothing values as rotation.
Enabled=1
; Position sensitivities, range 0.0 to 5.0.
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
; Lean limits in metres, range 0.01 to 0.5.
LimitX=0.30
; LimitY is the UPWARD limit, LimitYDown the downward one. Delete LimitYDown to
; mirror LimitY, which is the symmetric case; set it lower than LimitY if
; crouching wants a tighter range than standing.
LimitY=0.20
LimitYDown=0.20
LimitZ=0.40
LimitZBack=0.10

[Camera]
; Degrees ADDED to the game's own field of view. Pacific Drive has no FOV
; setting of its own, so this is the only way to change it.
;
; It is an offset rather than a fixed number on purpose: the game already uses a
; wider FOV in the car than on foot and widens it further with speed, and pinning
; one value would flatten all of that and reframe the car interior around
; something it was not built for. 0 renders exactly what the game asked for.
;
; HeadTracking.log reports the measured FOV every 30 seconds for the first few
; minutes of a session, then every five, e.g.
;   fov game=75.0 rendered=85.0 vertical=59.1 (offset +10.0)
; so if you want a specific number, read "game" off that line and set the
; difference here. Range -40 to 60; anything outside is clamped and logged.
;
; The change is applied to the rendered image only - the view point the game
; uses for interaction traces and AI keeps the FOV the game chose - and the
; crosshair, interaction highlights and objective markers are all corrected for
; it, so they stay on the things they point at.
FovOffset=0.0

[Controls]
; Windows virtual-key codes (hex). Chord alternatives Ctrl+Shift+Y/G/H are
; always active in addition to these. Range 0x01 to 0xFE.
;
; These are CODES, not key names: F1 is 0x70, not F1. "End" is not a code
; either. HeadTracking.log names the key each binding resolved to at startup, so
; check that line after changing one.
KeyToggle=0x23
KeyCycleMode=0x21
; Page Down - toggle world-space / camera-local yaw.
KeyYawMode=0x22
