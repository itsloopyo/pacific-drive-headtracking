name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Building and uploading an artifact needs nothing from the repository but the
# code. Without this the job runs with whatever the repo default grants, which
# is write on many repos.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    # release.ps1's version commit is written by Invoke-VersionCommit as
    # "chore: bump version to X.Y.Z". The older 'Release v' prefix matched
    # nothing, so every release still triggered a redundant Build run
    # alongside the Release workflow.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: bump version to') }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      # The boundary tests for the INI and the view math. They live in their own
      # build tree (PDHT_BUILD_TESTS is off for the shipped target), so nothing
      # else exercises them and without this step they rot silently.
      - name: Run tests
        shell: pwsh
        run: |
          pixi run test
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::'pixi run test' failed"
            exit 1
          }

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (configure -> build -> package);
      # the workflow owns none, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::'pixi run package' failed"
            exit 1
          }

      # The fleet's own manifest gate against the ZIP just built: delivery_mode
      # must be "manifest" and every path the launcher's deploy engine will read
      # has to exist inside the package. A manifest the gate rejects shipped
      # here precisely because nothing ever ran it.
      - name: Validate packaged manifest
        shell: pwsh
        run: |
          pixi run validate
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::launcher-manifest.json does not describe the installer ZIP"
            exit 1
          }

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-installer.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
